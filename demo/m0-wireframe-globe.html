<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>mini-cesium · M0 线框地球</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 12px; top: 12px; color: #9aa7b8;
         font: 12px/1.7 ui-monospace, Consolas, monospace; user-select: none; }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="hud">M0 · 线框地球 | 拖拽旋转 · 滚轮缩放 | FPS <span id="fps">--</span></div>

<script type="module">
/**
 * M0 验收:渲染一个线框球,拖拽不飘不抖,松手有惯性。
 *
 * 渲染流水线(每一帧都走这条链路,M0 之后所有 demo 都是这个骨架):
 *   CPU 侧:几何生成 → GPU Buffer 上传(一次性)
 *   每帧  :算 MVP → writeBuffer 更新 uniform → encode 渲染命令 → 提交
 *
 * 注意:本页使用相对路径 ES Module 导入,必须经静态服务器打开
 * (如 python -m http.server),file:// 下浏览器会因 CORS 拦截模块加载。
 */
import { initContext } from '../src/renderer/device.js';
import { createMesh } from '../src/renderer/mesh.js';
import { createSphereGeometry } from '../src/scene/sphere.js';
import { OrbitCamera } from '../src/scene/camera.js';
import { multiply, perspective } from '../src/math/mat4.js';

const canvas = document.getElementById('gpu');
const { device, context, format } = await initContext(canvas);

// ── 几何:单位球 + 线框边索引 ────────────────────────────────────
const geometry = createSphereGeometry({ radius: 1, latBands: 32, lonBands: 48 });
const mesh = createMesh(device, geometry, { withWireframe: true });

// ── 着色器(WGSL)────────────────────────────────────────────────
// M0 只需要"MVP 变换 + 纯色输出"。着色器随 demo 就近存放,
// M1 引入光照时再抽成共享模块。
const shader = device.createShaderModule({
  code: /* wgsl */ `
    struct Uniforms {
      mvp   : mat4x4f,   // 投影 × 视图(模型恒为单位阵)
      color : vec4f,
    };
    @group(0) @binding(0) var<uniform> u : Uniforms;

    // 顶点着色器:唯一职责是把本地坐标搬到裁剪空间。
    // @builtin(position) 就是裁剪空间坐标,硬件随后做透视除法与视口变换。
    struct VSOut { @builtin(position) pos : vec4f };
    @vertex
    fn vs(@location(0) position : vec3f) -> VSOut {
      var out : VSOut;
      out.pos = u.mvp * vec4f(position, 1.0);
      return out;
    }

    @fragment
    fn fs() -> @location(0) vec4f {
      return u.color;
    }
  `,
});

const pipeline = device.createRenderPipeline({
  // layout 'auto':让 WebGPU 根据 shader 里的 @group/@binding 自动推导绑定布局。
  // 代价是跨 pipeline 不能共享 layout;M4 出多 pipeline 时再显式声明。
  layout: 'auto',
  vertex: {
    module: shader,
    entryPoint: 'vs',
    buffers: [{
      arrayStride: 12,             // 每顶点 3 × float32
      attributes: [{
        shaderLocation: 0,         // 对应 vs 的 @location(0)
        offset: 0,
        format: 'float32x3',
      }],
    }],
  },
  fragment: {
    module: shader,
    entryPoint: 'fs',
    targets: [{ format }],         // 必须与画布格式一致,否则报错
  },
  primitive: {
    topology: 'line-list',         // 线框的关键:按"边索引"两两成对画线
  },
});

// uniform buffer:mat4(64B) + vec4(16B) = 80B,按 16 字节对齐要求刚好合法
const uniformBuffer = device.createBuffer({
  size: 80,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
});
device.queue.writeBuffer(uniformBuffer, 64, new Float32Array([0.55, 0.68, 0.85, 1.0]));

const bindGroup = device.createBindGroup({
  layout: pipeline.getBindGroupLayout(0),
  entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
});

// ── 相机与自适应尺寸 ────────────────────────────────────────────
const camera = new OrbitCamera({ distance: 3 });
camera.attach(canvas);

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}
window.addEventListener('resize', resize);
resize();

// ── 渲染循环 ────────────────────────────────────────────────────
let last = performance.now();
let fpsAccum = 0, fpsCount = 0;
const fpsEl = document.getElementById('fps');

function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  fpsAccum += dt; fpsCount++;
  if (fpsAccum > 0.5) {
    fpsEl.textContent = Math.round(fpsCount / fpsAccum);
    fpsAccum = 0; fpsCount = 0;
  }

  camera.update();
  resize(); // 分屏拖动等场景 resize 事件可能不触发,每帧兜底(成本为一次比较)

  // MVP = P · V · M。模型恒为单位阵,所以直接 P·V。
  // 乘法顺序:perspective 在最左 = 最后作用于顶点,这正是"投影"的正确位置。
  const mvp = multiply(
    perspective(Math.PI / 3, canvas.width / canvas.height, 0.1, 100),
    camera.viewMatrix()
  );
  device.queue.writeBuffer(uniformBuffer, 0, mvp);

  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      clearValue: { r: 0.043, g: 0.055, b: 0.078, a: 1 }, // #0b0e14
      loadOp: 'clear',        // 每帧整屏清掉(线框没有遮挡关系,暂不需要深度缓冲)
      storeOp: 'store',
    }],
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.setVertexBuffer(0, mesh.vertexBuffer);
  pass.setIndexBuffer(mesh.edgeIndexBuffer, 'uint32');
  pass.drawIndexed(mesh.edgeCount);
  pass.end();
  device.queue.submit([encoder.finish()]);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
